[package]
name = "reg-rs-store"
version = "0.1.0"
edition = "2024"

[dependencies]
reg-rs-types = { path = "../types" }
file-lock = "1.1.20"
log = "0.4.20"
rusqlite = "0.30.0"
serde = { version = "1.0.193", features = ["derive"] }
tinytemplate = "1.2.1"
toml = "0.8"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "sqlite"
harness = false
