[package]
name = "reg-rs"
version = "0.1.0"
authors = ["Mike Wright <wrightmikea@gmail.com>"]
edition = "2024"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
chrono = "0.4.31"

[dependencies]
chrono = "0.4.31"
colored = "2.1.0"
env_logger = "0.10.1"
fern = { version = "0.6.2", features = ["date-based"] }
file-lock = "1.1.20"

log = "0.4.20"
notify = "4.0.15"
rusqlite = "0.30.0"
serde = { version = "1.0.193", features = ["derive"] }
clap = { version = "4.4.6", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2", features = ["json"] }
text-diff = "0.4.0"
thiserror = "1.0.50"
tinytemplate = "1.2.1"
walkdir = "2.4.0"
async-stream = "0.3"
axum = "0.7.4"
futures-util = "0.3"
tokio = { version = "1.35.1", features = ["full"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

